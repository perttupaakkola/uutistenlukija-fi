name: Source validation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -B cutover/check_release.py public release/release.json
      - run: python3 -B -m unittest discover -s tests -p test_cutover.py
