name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact fresh public bundle
        run: python3 -B cutover/check_release.py public release/release.json
      - name: Reject superseded main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=uutistenlukija-fi --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
      - name: Bind successful production deployment to this packet and commit
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/pages/projects/uutistenlukija-fi'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
          assert result['success'] is True
          d=result['result']['canonical_deployment']
          assert d['environment']=='production' and d['latest_stage']['status']=='success'
          assert d['deployment_trigger']['metadata']['commit_hash']==os.environ['GITHUB_SHA']
          receipt=json.load(open('release/release.json'))
          record={'deployment_id':d['id'],'deployment_url':d['url'],'canonical_origin':'https://uutistenlukija.fi','remote_commit':os.environ['GITHUB_SHA'],'source_commit':receipt['source_commit'],'packet_sha256':receipt['packet_sha256'],'draft_sha256':receipt['draft_sha256'],'image_sha256':receipt['image_sha256'],'job_id':receipt['job_id']}
          open('live-deployment.json','w').write(json.dumps(record,indent=2)+'\n')
          print('Verified production deployment',d['id'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-deployment
          path: live-deployment.json
          retention-days: 7
