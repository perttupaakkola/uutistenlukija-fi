{{ define "main" }}
<div class="category-header">
  <h1>{{ .Title }}</h1>
  <p style="font-family: var(--font-sans); font-size: 0.95rem; color: var(--text-secondary); margin-top: 0.5rem;">Uutistenlukijan toimituskunta</p>
</div>

<div class="toimitus-grid">
  {{ range $.Site.Data.writers }}
  <div class="writer-card">
    <img src="{{ .image }}" alt="{{ .name }}" class="writer-photo" loading="lazy" decoding="async" width="120" height="120">
    <div class="writer-info">
      <span class="writer-name">{{ .name }}</span>
      <span class="writer-title">{{ .title }}</span>
      <p class="writer-bio">{{ .bio }}</p>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
