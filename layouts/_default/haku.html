{{ define "main" }}
<div class="search-page">
  <h1 class="search-heading">Haku</h1>
  <div class="search-box">
    <input
      type="search"
      id="search-input"
      placeholder="Hae artikkeleita..."
      aria-label="Haku"
      autocomplete="off"
      autofocus
    >
    <span id="search-count" class="search-count" aria-live="polite"></span>
  </div>
  <div id="search-results" role="list"></div>
</div>

<!-- Fuse.js 7.x — fuzzy search library, MIT license -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>

<script>
(function() {
  'use strict';

  var fuse = null;
  var articles = [];
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var countEl = document.getElementById('search-count');

  // Fuse.js config — fuzzy matching on title (high weight), description, category
  var fuseOptions = {
    includeScore: true,
    includeMatches: true,
    minMatchCharLength: 2,
    threshold: 0.35,
    keys: [
      { name: 'title',       weight: 0.6 },
      { name: 'description', weight: 0.25 },
      { name: 'category',    weight: 0.1 },
      { name: 'content',     weight: 0.05 }
    ]
  };

  // Load JSON index
  var resultsEl = document.getElementById('search-results');
  resultsEl.innerHTML = '<div class="search-loading">Ladataan...</div>';

  fetch('/index.json')
    .then(function(r) {
      if (!r.ok) throw new Error('index.json ' + r.status);
      return r.json();
    })
    .then(function(data) {
      articles = data;
      fuse = new Fuse(articles, fuseOptions);
      resultsEl.innerHTML = '';
      // Run search if q param present in URL
      var q = getQueryParam('q');
      if (q) {
        input.value = q;
        doSearch(q);
      }
    })
    .catch(function(err) {
      resultsEl.innerHTML = '<div class="no-results">Hakuindeksin lataus epäonnistui.</div>';
      console.error('Search index load failed:', err);
    });

  // Read URL query param
  function getQueryParam(name) {
    try {
      var params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    } catch(e) {
      return '';
    }
  }

  // Update URL bar without reload so results are bookmarkable
  function updateUrl(q) {
    try {
      var url = new URL(window.location);
      if (q) {
        url.searchParams.set('q', q);
      } else {
        url.searchParams.delete('q');
      }
      history.replaceState(null, '', url.toString());
    } catch(e) {}
  }

  // Escape HTML to prevent XSS
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // Highlight matched ranges in a string
  function highlight(str, ranges) {
    if (!ranges || !ranges.length) return esc(str);
    var out = '';
    var prev = 0;
    // ranges is array of [start, end] pairs
    ranges.forEach(function(r) {
      out += esc(str.slice(prev, r[0]));
      out += '<mark>' + esc(str.slice(r[0], r[1] + 1)) + '</mark>';
      prev = r[1] + 1;
    });
    out += esc(str.slice(prev));
    return out;
  }

  // Category display names (Finnish)
  var catNames = {
    'kotimaa': 'Kotimaa', 'ulkomaat': 'Ulkomaat', 'talous': 'Talous',
    'teknologia': 'Teknologia', 'urheilu': 'Urheilu', 'kulttuuri': 'Kulttuuri',
    'tiede': 'Tiede'
  };

  function renderResults(fuseResults, query) {
    if (!fuseResults.length) {
      countEl.textContent = '';
      results.innerHTML = '<div class="no-results">Ei hakutuloksia haulle &ldquo;' + esc(query) + '&rdquo;</div>';
      return;
    }

    var n = fuseResults.length;
    countEl.textContent = n + ' tulos' + (n === 1 ? '' : 'ta');

    results.innerHTML = fuseResults.slice(0, 20).map(function(r) {
      var a = r.item;
      var matchMap = {};
      (r.matches || []).forEach(function(m) { matchMap[m.key] = m.indices; });

      var titleHtml = matchMap.title ? highlight(a.title, matchMap.title) : esc(a.title);
      var snippetText = a.description || a.content || '';
      var snippetHtml = matchMap.description
        ? highlight(snippetText.substring(0, 180), matchMap.description)
        : esc(snippetText.substring(0, 180));
      if (snippetText.length > 180) snippetHtml += '&hellip;';

      var catSlug = (a.category || '').toLowerCase();
      var catLabel = catNames[catSlug] || a.category;
      var catHtml = catLabel
        ? '<a class="result-cat" href="/categories/' + esc(catSlug) + '/">' + esc(catLabel) + '</a>'
        : '';

      var thumbHtml = a.image
        ? '<img class="result-thumb" src="' + esc(a.image) + '" alt="" loading="lazy" decoding="async" width="80" height="60">'
        : '';

      return '<div class="search-result" role="listitem">' +
        thumbHtml +
        '<div class="result-body">' +
        '<h3><a href="' + esc(a.url) + '">' + titleHtml + '</a></h3>' +
        '<div class="result-meta">' + catHtml + esc(a.date) + '</div>' +
        (snippetHtml ? '<p class="result-snippet">' + snippetHtml + '</p>' : '') +
        '</div>' +
        '</div>';
    }).join('');
  }

  function doSearch(q) {
    q = q.trim();
    updateUrl(q);
    if (q.length < 2) {
      results.innerHTML = '';
      countEl.textContent = '';
      return;
    }
    if (!fuse) return; // still loading
    var res = fuse.search(q);
    renderResults(res, q);
  }

  // Debounce input
  var debounceTimer;
  input.addEventListener('input', function() {
    var val = this.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() { doSearch(val); }, 180);
  });

  // Handle browser back/forward navigation
  window.addEventListener('popstate', function() {
    var q = getQueryParam('q');
    input.value = q;
    if (q) doSearch(q); else { results.innerHTML = ''; countEl.textContent = ''; }
  });

})();
</script>
{{ end }}
