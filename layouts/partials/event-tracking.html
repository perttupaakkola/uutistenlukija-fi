{{- /* GA4 custom event tracking — no-ops silently if GA4 is not configured */}}
{{- $page := . }}
{{- with .Site.Params.ga4_id }}
<script>
(function () {
  'use strict';

  // Page context — set by Hugo at build time
  var _isPage = {{ if $page.IsPage }}true{{ else }}false{{ end }};
  var _articleTitle = {{ if $page.IsPage }}{{ $page.Title | jsonify }}{{ else }}""{{ end }};
  var _articleCategory = {{ if $page.IsPage }}{{ with $page.Params.categories }}{{ index . 0 | jsonify }}{{ else }}{{ with $page.Params.category }}{{ . | jsonify }}{{ else }}"uncategorized"{{ end }}{{ end }}{{ else }}""{{ end }};
  var _articleSlug = {{ if $page.IsPage }}{{ with $page.File }}{{ .BaseFileName | jsonify }}{{ else }}""{{ end }}{{ else }}""{{ end }};

  // Guard: only run if gtag is available
  function _gtag() {
    if (typeof gtag === 'function') {
      gtag.apply(null, arguments);
    }
  }

  // ── article_scroll_depth + article_read ────────────────────────────────
  // Uses IntersectionObserver markers inside the article body.
  if (_isPage && 'IntersectionObserver' in window) {
    (function () {
      var articleBody = document.querySelector('.article-body, .content');
      if (!articleBody) return;

      var thresholds = [25, 50, 75, 100];
      var firedDepths = Object.create(null);
      var articleReadFired = false;

      function ensurePositionContext(el) {
        if (window.getComputedStyle(el).position === 'static') {
          el.style.position = 'relative';
        }
      }

      function markerTopPx(depth, height) {
        if (depth === 100) {
          return Math.max(height - 2, 0);
        }
        return Math.max(Math.round((height * depth) / 100) - 1, 0);
      }

      function initObserver() {
        var height = articleBody.scrollHeight;
        if (!height) return;

        ensurePositionContext(articleBody);

        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;

            var depth = Number(entry.target.getAttribute('data-depth'));
            if (!depth || firedDepths[depth]) return;

            firedDepths[depth] = true;
            _gtag('event', 'article_scroll_depth', {
              depth: depth,
              article_title: _articleTitle,
              article_category: _articleCategory
            });

            if (depth === 75 && !articleReadFired) {
              articleReadFired = true;
              _gtag('event', 'article_read', {
                article_title: _articleTitle,
                article_category: _articleCategory,
                article_slug: _articleSlug
              });
            }

            observer.unobserve(entry.target);
          });
        }, {
          threshold: 0
        });

        thresholds.forEach(function (depth) {
          var marker = document.createElement('span');
          marker.setAttribute('data-depth', String(depth));
          marker.setAttribute('aria-hidden', 'true');
          marker.style.cssText = [
            'position:absolute',
            'left:0',
            'top:' + markerTopPx(depth, height) + 'px',
            'width:1px',
            'height:1px',
            'pointer-events:none',
            'opacity:0'
          ].join(';');
          articleBody.appendChild(marker);
          observer.observe(marker);
        });
      }

      if (document.readyState === 'complete') {
        initObserver();
      } else {
        window.addEventListener('load', initObserver, { once: true });
      }
    })();
  }

  // ── search_used ─────────────────────────────────────────────────────────
  // Fires on search form submission (looks for <form role="search">).
  (function () {
    var form = document.querySelector('form[role="search"]');
    if (!form) return;
    form.addEventListener('submit', function () {
      var input = form.querySelector('input[type="search"], input[name="q"]');
      _gtag('event', 'search_used', {
        search_term: input ? input.value.trim() : ''
      });
    });
  })();

  // ── newsletter_signup ───────────────────────────────────────────────────
  // Fires when newsletter form is submitted (form with data-event="newsletter").
  (function () {
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (form && form.dataset.event === 'newsletter') {
        _gtag('event', 'newsletter_signup', {
          location: form.dataset.location || 'unknown',
          variant: form.dataset.variant || 'default'
        });
      }
    });
  })();

  // ── data-track click events ────────────────────────────────────────────
  // Fires GA4 events from declarative data attributes.
  (function () {
    function safeLinkUrl(el) {
      var href = el.href || '';
      var schemeMatch = href.match(/^([a-z][a-z0-9+.-]*):/i);
      if (schemeMatch && /^(mailto|tel)$/i.test(schemeMatch[1])) {
        return schemeMatch[1].toLowerCase() + ':';
      }
      return href;
    }

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-track]');
      if (!el) return;

      var eventName = el.dataset.track;
      if (!eventName) return;

      var params = {
        link_url: safeLinkUrl(el),
        link_text: (el.textContent || '').trim().slice(0, 100)
      };

      Object.keys(el.dataset).forEach(function (key) {
        if (key === 'track') return;
        params[key] = el.dataset[key];
      });

      if (eventName === 'source_click') {
        var sourceName = el.dataset.sourceName || '';
        if (!sourceName && el.href) {
          try {
            sourceName = new URL(el.href).hostname || '';
          } catch (err) {}
        }
        params.source_name = sourceName;
        params.article_title = _articleTitle;
        params.article_category = _articleCategory;
      }

      _gtag('event', eventName, params);
    });
  })();



  // ── monetization CTA funnel ─────────────────────────────────────────────
  // Stores anonymous local intent so /api/business-control-panel.json can
  // expose a safe_public=true measurable growth-loop target without reading
  // external analytics credentials. GA4 receives the same event when consented.
  (function () {
    var KEY = 'uutistenlukija_monetization_signal_v1';

    function readState() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || '{}') || {};
      } catch (err) {
        return {};
      }
    }

    function writeState(state) {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (err) {}
    }

    function recordNamedFoundingSponsorClick(kind, placement, pagePath) {
      var allowedEvents = {
        founding_sponsor_page_click: true,
        founding_sponsor_contact_click: true,
        founding_sponsor_interest_click: true
      };
      if (!allowedEvents[kind]) return;

      _gtag('event', kind, {
        placement: placement,
        page_path: pagePath
      });
    }

    function recordSignal(kind, el) {
      var state = readState();
      var now = new Date().toISOString();
      state[kind] = (Number(state[kind]) || 0) + 1;
      state.last_signal = kind;
      state.last_signal_at = now;
      state.last_path = window.location.pathname;
      state.last_placement = el ? (el.dataset.placement || el.dataset.package || 'unknown') : 'unknown';
      writeState(state);

      _gtag('event', 'monetization_signal', {
        signal_type: kind,
        placement: state.last_placement,
        page_path: state.last_path
      });
      recordNamedFoundingSponsorClick(kind, state.last_placement, state.last_path);
    }

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-monetization-signal]');
      if (!el) return;
      recordSignal(el.dataset.monetizationSignal || 'unknown', el);
    });

    var viewTarget = document.querySelector('[data-monetization-view]');
    if (!viewTarget || !('IntersectionObserver' in window)) return;

    var viewTimer = null;
    var viewFired = false;
    var viewObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (viewFired) return;
        if (!entry.isIntersecting || entry.intersectionRatio < 0.5) {
          if (viewTimer !== null) {
            window.clearTimeout(viewTimer);
            viewTimer = null;
          }
          return;
        }

        if (viewTimer !== null) return;
        viewTimer = window.setTimeout(function () {
          var kind = viewTarget.dataset.monetizationView;
          viewTimer = null;
          viewFired = true;
          viewObserver.unobserve(viewTarget);
          recordSignal(kind, viewTarget);
          _gtag('event', kind, {
            placement: viewTarget.dataset.placement || 'unknown',
            page_path: window.location.pathname
          });
        }, 1000);
      });
    }, { threshold: [0.5] });

    viewObserver.observe(viewTarget);
  })();

  // ── outbound_click ──────────────────────────────────────────────────────
  // Fires when a visitor clicks an external link (different hostname).
  (function () {
    var host = window.location.hostname;
    document.addEventListener('click', function (e) {
      var anchor = e.target.closest('a[href]');
      if (!anchor || anchor.dataset.track) return;
      try {
        var url = new URL(anchor.href);
        if (url.hostname && url.hostname !== host) {
          _gtag('event', 'outbound_click', {
            outbound_url: url.href,
            outbound_host: url.hostname,
            link_text: (anchor.textContent || '').trim().slice(0, 100)
          });
        }
      } catch (err) {}
    });
  })();

  // ── category_navigate ───────────────────────────────────────────────────
  // Fires when a visitor clicks a category link (href contains /kategoria/).
  (function () {
    document.addEventListener('click', function (e) {
      var anchor = e.target.closest('a[href]');
      if (!anchor || anchor.dataset.track) return;
      var href = anchor.getAttribute('href') || '';
      if (href.indexOf('/categories/') !== -1 || href.indexOf('/kategoria/') !== -1) {
        var parts = href.replace(/\/$/, '').split('/');
        var category = parts[parts.length - 1] || 'unknown';
        _gtag('event', 'category_navigate', {
          category_name: category,
          from_page: window.location.pathname
        });
      }
    });
  })();

})();
</script>
{{- end }}
