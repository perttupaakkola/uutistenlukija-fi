{{- /* GA4 custom event tracking — no-ops silently if GA4 is not configured */}}
{{- $page := . }}
{{- with .Site.Params.ga4_id }}
<script>
(function () {
  'use strict';

  // Page context — set by Hugo at build time
  var _isPage = {{ if and $page.IsPage (eq $page.Section "posts") }}true{{ else }}false{{ end }};
  var _articleTitle = {{ if $page.IsPage }}{{ $page.Title }}{{ else }}""{{ end }};
  var _articleCategory = {{ if $page.IsPage }}{{ with $page.Params.categories }}{{ index . 0 }}{{ else }}{{ with $page.Params.category }}{{ . }}{{ else }}"uncategorized"{{ end }}{{ end }}{{ else }}""{{ end }};
  var _articleSlug = {{ if $page.IsPage }}{{ with $page.File }}{{ .BaseFileName }}{{ else }}""{{ end }}{{ else }}""{{ end }};

  // cookie-banner.html applies these preferences, including revocation.
  var _gaId = {{ . }};
  function analyticsAllowed() {
    return !!(window.__UL_AD_CONSENT__ && window.__UL_AD_CONSENT__.analytics === true &&
      window['ga-disable-' + _gaId] !== true && typeof window.gtag === 'function');
  }
  function _gtag(action, name, params) {
    if (!analyticsAllowed()) return false;
    var traffic = window.__UL_ANALYTICS_TRAFFIC_TYPE__;
    params = params || {};
    params.traffic_type = traffic === 'qa' || traffic === 'internal' ? traffic : 'unclassified';
    window.gtag(action, name, params);
    return true;
  }

  // Post-consent visible dwell plus depth, not comprehension or retention.
  // Poll the banner's applied state: it has no consent-change event. No
  // pre-consent observer, interaction queue or dwell history is retained.
  if (_isPage && 'IntersectionObserver' in window) {
    (function () {
      var body = document.querySelector('[data-article-body]');
      if (!body) return;
      var observer = null, markers = [], visible = false, reached75 = false;
      var dwell = 0, last = null, depths = Object.create(null), readFired = false;
      function stop() {
        if (observer) observer.disconnect();
        observer = null;
        markers.forEach(function (marker) { marker.remove(); });
        markers = [];
        visible = false; reached75 = false; dwell = 0; last = null;
        depths = Object.create(null);
      }
      function start() {
        if (!body.scrollHeight) return;
        if (window.getComputedStyle(body).position === 'static') body.style.position = 'relative';
        observer = new IntersectionObserver(function (entries) {
          if (!analyticsAllowed()) { stop(); return; }
          entries.forEach(function (entry) {
            if (entry.target === body) { visible = entry.isIntersecting; last = null; return; }
            if (!entry.isIntersecting || document.visibilityState !== 'visible') return;
            var depth = Number(entry.target.getAttribute('data-depth'));
            if (depth === 75) reached75 = true;
            if (!depths[depth] && _gtag('event', 'article_scroll_depth', {
              depth: depth, article_title: _articleTitle, article_category: _articleCategory
            })) depths[depth] = true;
          });
        }, { threshold: 0 });
        observer.observe(body);
        [25, 50, 75, 100].forEach(function (depth) {
          var marker = document.createElement('span');
          marker.setAttribute('data-depth', String(depth));
          marker.setAttribute('aria-hidden', 'true');
          marker.style.cssText = 'position:absolute;left:0;top:' +
            Math.max(Math.round(body.scrollHeight * depth / 100) - 2, 0) +
            'px;width:1px;height:1px;pointer-events:none;opacity:0';
          body.appendChild(marker); markers.push(marker); observer.observe(marker);
        });
      }
      document.addEventListener('visibilitychange', function () { last = null; });
      function tick() {
        if (!analyticsAllowed()) { if (observer) stop(); return; }
        if (document.readyState !== 'complete') return;
        if (!observer) start();
        var now = performance.now();
        if (visible && document.visibilityState === 'visible') {
          // Cap timer gaps: suspended tabs must not accumulate background time.
          if (last !== null) dwell += Math.min(now - last, 1000);
          last = now;
          if (reached75 && dwell >= 15000 && !readFired) {
            readFired = _gtag('event', 'article_read', {
              article_title: _articleTitle, article_category: _articleCategory,
              article_slug: _articleSlug, visible_dwell_seconds: Math.floor(dwell / 1000),
              measurement_version: 'visible_dwell_v2'
            });
          }
        } else { last = null; }
      }
      window.setInterval(tick, 500);
      tick();
    })();
  }

  // ── search_used ─────────────────────────────────────────────────────────
  // Fires on search form submission (looks for <form role="search">).
  (function () {
    var form = document.querySelector('form[role="search"]');
    if (!form) return;
    form.addEventListener('submit', function () {
      var input = form.querySelector('input[type="search"], input[name="q"]');
      _gtag('event', 'search_used', {
        search_term: input ? input.value.trim() : ''
      });
    });
  })();

  // ── newsletter_signup ───────────────────────────────────────────────────
  // Fires when newsletter form is submitted (form with data-event="newsletter").
  (function () {
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (form && form.dataset.event === 'newsletter') {
        _gtag('event', 'newsletter_signup', {
          location: form.dataset.location || 'unknown',
          variant: form.dataset.variant || 'default'
        });
      }
    });
  })();

  // ── data-track click events ────────────────────────────────────────────
  // Fires GA4 events from declarative data attributes.
  (function () {
    function safeLinkUrl(el) {
      var href = el.href || '';
      var schemeMatch = href.match(/^([a-z][a-z0-9+.-]*):/i);
      if (schemeMatch && /^(mailto|tel)$/i.test(schemeMatch[1])) {
        return schemeMatch[1].toLowerCase() + ':';
      }
      return href;
    }

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-track]');
      if (!el) return;

      var eventName = el.dataset.track;
      if (!eventName) return;

      var params = {
        link_url: safeLinkUrl(el),
        link_text: (el.textContent || '').trim().slice(0, 100)
      };

      Object.keys(el.dataset).forEach(function (key) {
        if (key === 'track') return;
        params[key] = el.dataset[key];
      });

      if (eventName === 'source_click') {
        var sourceName = el.dataset.sourceName || '';
        if (!sourceName && el.href) {
          try {
            sourceName = new URL(el.href).hostname || '';
          } catch (err) {}
        }
        params.source_name = sourceName;
        params.article_title = _articleTitle;
        params.article_category = _articleCategory;
      }

      _gtag('event', eventName, params);
    });
  })();



  // ── monetization CTA funnel ─────────────────────────────────────────────
  // Keep existing GA4 click names under the applied analytics consent gate.
  // No persistent interaction history: no consumer uses the former local counter.
  (function () {
    function recordNamedFoundingSponsorClick(kind, placement, pagePath) {
      var allowedEvents = {
        founding_sponsor_page_click: true,
        founding_sponsor_contact_click: true,
        founding_sponsor_interest_click: true
      };
      if (!allowedEvents[kind]) return;

      _gtag('event', kind, {
        placement: placement,
        page_path: pagePath
      });
    }

    function recordSignal(kind, el) {
      if (!analyticsAllowed()) return;
      var placement = el ? (el.dataset.placement || el.dataset.package || 'unknown') : 'unknown';
      var pagePath = window.location.pathname;
      _gtag('event', 'monetization_signal', {
        signal_type: kind,
        placement: placement,
        page_path: pagePath
      });
      recordNamedFoundingSponsorClick(kind, placement, pagePath);
    }

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-monetization-signal]');
      if (!el) return;
      recordSignal(el.dataset.monetizationSignal || 'unknown', el);
    });

  })();

  // ── outbound_click ──────────────────────────────────────────────────────
  // Fires when a visitor clicks an external link (different hostname).
  (function () {
    var host = window.location.hostname;
    document.addEventListener('click', function (e) {
      var anchor = e.target.closest('a[href]');
      if (!anchor || anchor.dataset.track) return;
      try {
        var url = new URL(anchor.href);
        if (url.hostname && url.hostname !== host) {
          _gtag('event', 'outbound_click', {
            outbound_url: url.href,
            outbound_host: url.hostname,
            link_text: (anchor.textContent || '').trim().slice(0, 100)
          });
        }
      } catch (err) {}
    });
  })();

  // ── category_navigate ───────────────────────────────────────────────────
  // Fires when a visitor clicks a category link (href contains /kategoria/).
  (function () {
    document.addEventListener('click', function (e) {
      var anchor = e.target.closest('a[href]');
      if (!anchor || anchor.dataset.track) return;
      var href = anchor.getAttribute('href') || '';
      if (href.indexOf('/categories/') !== -1 || href.indexOf('/kategoria/') !== -1) {
        var parts = href.replace(/\/$/, '').split('/');
        var category = parts[parts.length - 1] || 'unknown';
        _gtag('event', 'category_navigate', {
          category_name: category,
          from_page: window.location.pathname
        });
      }
    });
  })();

})();
</script>
{{- end }}
