<header class="site-header" role="banner">
  <div class="portal-masthead">
    <a class="portal-logo" href="/" aria-label="Uutistenlukija etusivulle">
      <img src="/images/logo.png" alt="Uutistenlukija" class="portal-logo__image" loading="eager" decoding="async" width="220" height="43">
    </a>

    <div class="portal-search site-search site-search--collapsed" data-site-search>
      <button class="portal-icon-button search-toggle-btn" type="button" aria-label="Avaa haku" data-search-toggle>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
        <span class="portal-mobile-label">Hae</span>
      </button>
      <form class="site-search__form" role="search" aria-label="Etsi uutisia" data-search-form>
        <label class="site-search__label" for="header-search-input">Hae uutisia</label>
        <input id="header-search-input" class="site-search__input" type="search" name="q" placeholder="Hae uutisia, aiheita tai yhtiöitä" aria-label="Hae uutisia" autocomplete="off" data-search-input>
        <button class="site-search__submit" type="submit" aria-label="Hae">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
        </button>
      </form>
      <div class="site-search__status" aria-live="polite" data-search-status></div>
      <div class="search-dropdown" hidden data-search-dropdown></div>
    </div>

    <div class="portal-actions" aria-label="Pikatoiminnot">
      <span class="portal-weather" aria-label="Sää Helsingissä">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span><strong>18 °C</strong><small>Helsinki</small></span>
      </span>
      <a class="portal-action portal-action--desktop" href="/paivan-tarkeimmat-uutiset/"><span class="portal-live-dot" aria-hidden="true"></span>Live</a>
      <a class="portal-action portal-action--desktop" href="/tila/">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
        Tallennetut
      </a>
      <button id="theme-toggle" class="portal-icon-button theme-toggle-btn" aria-label="Vaihda teema">
        <svg class="theme-icon theme-icon--dark" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="theme-icon theme-icon--light" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="hamburger" class="portal-icon-button hamburger-btn" aria-label="Avaa valikko" aria-expanded="false" aria-controls="main-nav-menu">
        <svg class="portal-menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="portal-mobile-label">Valikko</span>
      </button>
    </div>
  </div>

  <nav class="main-nav" id="main-nav-menu" aria-label="Päävalikko" role="navigation">
    <ul>
      <li><a href="/"{{ if .IsHome }} aria-current="page"{{ end }}>Etusivu</a></li>
      {{ range .Site.Menus.main }}
      {{ if ne .URL "/haku/" }}
      <li><a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
      {{ end }}
      <li><a href="/paivan-tarkeimmat-uutiset/">Tuoreimmat</a></li>
    </ul>
  </nav>
</header>
