<header class="site-header" role="banner">
  <div class="header-banner" aria-hidden="true"></div>
  <div class="container header-inner">
    <div class="header-main-row">
      <div class="site-logo">
        <a href="/" aria-label="Uutistenlukija — etusivulle"><img src="/images/logo.png" alt="Uutistenlukija" class="logo-img" loading="eager" decoding="async" width="160" height="40"></a>
      </div>
      <p class="site-date" aria-label="Päivämäärä">{{ partial "finnish-date.html" . }}</p>
      <button id="hamburger" class="hamburger-btn" aria-label="Avaa valikko" aria-expanded="false" aria-controls="main-nav-menu">
        <span class="hamburger-line" aria-hidden="true"></span>
        <span class="hamburger-line" aria-hidden="true"></span>
        <span class="hamburger-line" aria-hidden="true"></span>
      </button>
      <nav class="main-nav" id="main-nav-menu" aria-label="Päävalikko" role="navigation">
        <ul>
          {{ range .Site.Menus.main }}
          {{ if ne .URL "/haku/" }}
          <li><a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
          {{ end }}
        </ul>
      </nav>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Vaihda teema">
        <svg class="theme-icon theme-icon--dark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon theme-icon--light" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <div class="site-search site-search--collapsed" data-site-search>
        <button class="search-toggle-btn" type="button" aria-label="Avaa haku" data-search-toggle>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <form class="site-search__form" role="search" aria-label="Etsi artikkeleita" data-search-form>
          <label class="site-search__label" for="header-search-input">Hae</label>
          <svg class="site-search__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="header-search-input" class="site-search__input" type="search" name="q" placeholder="Etsi artikkeleita…" aria-label="Etsi artikkeleita" autocomplete="off" data-search-input>
          <button class="site-search__submit" type="submit">Hae</button>
        </form>
        <div class="site-search__status" aria-live="polite" data-search-status></div>
        <div class="search-dropdown" hidden data-search-dropdown></div>
      </div>
    </div>
  </div>
</header>
