<header class="site-header">
  <div class="header-banner"></div>
  <div class="container header-inner">
    <div class="site-logo">
      <a href="/"><img src="/images/logo.png" alt="Uutistenlukija" class="logo-img"></a>
    </div>
    <p class="site-date">{{ partial "finnish-date.html" . }}</p>
    <button id="hamburger" class="hamburger-btn" aria-label="Avaa valikko" aria-expanded="false" aria-controls="main-nav-menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <nav class="main-nav" id="main-nav-menu" aria-label="Päävalikko">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <a href="/haku/" class="search-nav-btn" aria-label="Haku">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Vaihda teema">🌙</button>
  </div>
</header>
