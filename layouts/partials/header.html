<header class="site-header">
  <div class="header-banner"></div>
  <div class="container header-inner">
    <div class="site-logo">
      <a href="/"><img src="/images/logo.png" alt="Uutistenlukija" class="logo-img"></a>
    </div>
    <p class="site-date">{{ partial "finnish-date.html" . }}</p>
    <button id="hamburger" class="hamburger-btn" aria-label="Avaa valikko" aria-expanded="false" aria-controls="main-nav-menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <nav class="main-nav" id="main-nav-menu" aria-label="Päävalikko">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Vaihda teema">🌙</button>
  </div>
</header>
