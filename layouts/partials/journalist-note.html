{{- /* Journalist Note — Conditional editorial note from journalist at end of article */ -}}
{{- with .Params.journalist_note }}
<aside class="journalist-note" role="doc-note" aria-label="Toimittajan huomio">
  <div class="journalist-note-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="journalist-note-icon">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
      <path d="M12 16v-4M12 8h.01"></path>
    </svg>
    <span class="journalist-note-label">Toimittajan huomio</span>
  </div>
  <div class="journalist-note-content">
    {{- . | markdownify -}}
  </div>
</aside>
{{- end }}
