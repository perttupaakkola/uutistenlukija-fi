{{- $url := .Permalink | absURL -}}
{{- $title := .Title -}}
{{- $encodedTitle := $title | urlquery -}}
<div class="share-buttons-row" aria-label="Jaa artikkeli">
  <span class="share-buttons-row__label">Jaa:</span>

  <a class="share-buttons-row__button" href="https://twitter.com/intent/tweet?url={{ $url }}&text={{ $encodedTitle }}" target="_blank" rel="noopener noreferrer" aria-label="Jaa X:ssä" title="Jaa X:ssä" onclick="if(typeof gtag==='function'){gtag('event','share_click',{method:'twitter',article_title:{{ $title | jsonify }}});}">
    <span class="share-buttons-row__icon" aria-hidden="true">𝕏</span>
    <span>Jaa X:ssä</span>
  </a>

  <a class="share-buttons-row__button" href="https://www.facebook.com/sharer/sharer.php?u={{ $url }}" target="_blank" rel="noopener noreferrer" aria-label="Jaa Facebookissa" title="Jaa Facebookissa" onclick="if(typeof gtag==='function'){gtag('event','share_click',{method:'facebook',article_title:{{ $title | jsonify }}});}">
    <span class="share-buttons-row__icon" aria-hidden="true">f</span>
    <span>Facebook</span>
  </a>

  <a class="share-buttons-row__button" href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url }}" target="_blank" rel="noopener noreferrer" aria-label="Jaa LinkedInissä" title="Jaa LinkedInissä" onclick="if(typeof gtag==='function'){gtag('event','share_click',{method:'linkedin',article_title:{{ $title | jsonify }}});}">
    <span class="share-buttons-row__icon" aria-hidden="true">in</span>
    <span>LinkedIn</span>
  </a>

  <a class="share-buttons-row__button" href="https://wa.me/?text={{ printf "%s %s" $title $url | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="Jaa WhatsAppissa" title="Jaa WhatsAppissa" onclick="if(typeof gtag==='function'){gtag('event','share_click',{method:'whatsapp',article_title:{{ $title | jsonify }}});}">
    <span class="share-buttons-row__icon" aria-hidden="true">wa</span>
    <span>WhatsApp</span>
  </a>

  <button
    class="share-buttons-row__button share-buttons-row__button--copy"
    type="button"
    data-share-url="{{ $url }}"
    data-copy-label="Kopioi linkki"
    data-copied-label="Kopioitu"
    aria-label="Kopioi linkki"
    title="Kopioi linkki"
    onclick="if(typeof gtag==='function'){gtag('event','share_click',{method:'copy_link',article_title:{{ $title | jsonify }}});}(function(btn){var url=btn.getAttribute('data-share-url');var copied=btn.getAttribute('data-copied-label')||'Kopioitu';var reset=btn.getAttribute('data-copy-label')||'Kopioi linkki';var label=btn.querySelector('[data-copy-text]');function done(){btn.classList.add('is-copied');if(label)label.textContent=copied;window.setTimeout(function(){btn.classList.remove('is-copied');if(label)label.textContent=reset;},2000);}function fallback(){var ta=document.createElement('textarea');ta.value=url;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}finally{document.body.removeChild(ta);}}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,fallback);}else{fallback();}})(this)">
    <span class="share-buttons-row__icon" aria-hidden="true">🔗</span>
    <span data-copy-text>Kopioi linkki</span>
  </button>
</div>
