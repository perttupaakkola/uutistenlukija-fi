{{/* critical-css.html — Inlined above-fold CSS for render performance.
     Updated from themes/uutistenlukija/static/css/style.css (lines 1-250).
     Keep in sync when style.css changes significantly. */}}
<style>
/* === Reset & Base === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fafaf8;
  --text: #1a1a1a;
  --text-secondary: #555;
  --accent: #c0392b;
  --border: #e0ddd8;
  --card-bg: #fff;
  --max-width: 1100px;
  --font-serif: 'Georgia', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Dark mode */
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #e8e6e3;
  --text-secondary: #a0a0a0;
  --accent: #e74c3c;
  --border: #333;
  --card-bg: #242424;
}

[data-theme="dark"] a { color: var(--text); }
[data-theme="dark"] .site-title a { color: var(--text); }
[data-theme="dark"] .author-box { background: #2a2a2a; }
[data-theme="dark"] .related-link:hover .related-title { color: var(--accent); }

body {
  font-family: var(--font-serif);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 17px;
}

a { color: var(--text); text-decoration: none; }
a:hover { color: var(--accent); }

img { max-width: 100%; height: auto; }

/* === Layout === */
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 1.5rem; }

/* === Header === */
.site-header {
  border-bottom: 3px solid var(--text);
  margin-bottom: 2rem;
}

.header-banner {
  background: url('/images/branding/banner.png') center/cover no-repeat;
  height: 60px;
  opacity: 0.15;
}

[data-theme="dark"] .header-banner {
  opacity: 0.08;
}

.site-logo {
  text-align: center;
  padding: 1rem 0 0.25rem;
}

.logo-img {
  max-height: 80px;
  width: auto;
}

[data-theme="dark"] .logo-img {
  filter: invert(1) hue-rotate(180deg);
}

.site-title {
  font-family: var(--font-serif);
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: -0.02em;
  text-align: center;
  margin-bottom: 0.25rem;
}

.site-title a { color: var(--text); }
.site-title a:hover { color: var(--accent); }

.site-subtitle {
  text-align: center;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 1rem;
}

.site-date {
  text-align: center;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* === Theme Toggle === */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1;
}

.theme-toggle:hover {
  background: var(--accent) !important;
  color: #fff !important;
  border-color: var(--accent) !important;
}

.theme-toggle-icon {
  font-size: 1rem;
  line-height: 1;
}

.theme-toggle-label {
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* === Navigation === */
.main-nav {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 0.6rem 0;
  margin-top: 1rem;
}

.main-nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.25rem;
}

.main-nav a {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.3rem 0.8rem;
  border-radius: 3px;
  transition: background 0.15s;
}

.main-nav a:hover {
  background: var(--accent);
  color: #fff;
}

/* === Category Pills === */
.category-pill {
  font-family: var(--font-sans);
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: inline-flex;
  align-items: center;
  padding: 0.22rem 0.65rem;
  border-radius: 999px;
  margin-bottom: 0.6rem;
  line-height: 1.1;
  color: #fff;
  background: var(--accent);
}

.category-kotimaa { background: #1f6feb; }
.category-ulkomaat { background: #8e44ad; }
.category-talous { background: #1f8f5f; }
.category-teknologia { background: #0f766e; }
.category-urheilu { background: #d97706; }
.category-kulttuuri { background: #c2410c; }
.category-tiede { background: #2563eb; }

/* === Article Grid === */
.articles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.5rem;
  margin: 2rem 0;
}

.article-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 1.5rem;
  transition: box-shadow 0.2s;
}

.article-card:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.article-card .category-label {
  margin-bottom: 0.5rem;
}

.article-card h2 {
  font-size: 1.2rem;
  line-height: 1.35;
  margin-bottom: 0.6rem;
  font-weight: 700;
}

.article-card h2 a:hover { color: var(--accent); }

.article-card .excerpt {
  font-size: 0.95rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 0.75rem;
}

.article-card .meta {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: #888;
}

/* === Featured/Lead Article === */
.lead-article {
  border-bottom: 2px solid var(--border);
  border-left: 5px solid var(--accent);
  background: var(--card-bg);
  background: color-mix(in srgb, var(--accent) 6%, var(--card-bg));
  padding: 1.5rem 1.5rem 2rem;
  margin-bottom: 2rem;
  border-radius: 4px;
}

.lead-article h2 {
  font-size: 2.5rem;
  line-height: 1.15;
  margin-bottom: 0.85rem;
}

/* Skip-to-content (accessibility) */
.skip-to-content {
  position: absolute;
  left: -999px;
  top: auto;
  width: 1px;
  height: 1px;
  overflow: hidden;
  z-index: -999;
}
.skip-to-content:focus,
.skip-to-content:active {
  left: 0;
  top: 0;
  width: auto;
  height: auto;
  overflow: visible;
  z-index: 999;
  background: var(--accent);
  color: #fff;
  padding: 0.5rem 1rem;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  border-radius: 0 0 4px 0;
}
</style>
