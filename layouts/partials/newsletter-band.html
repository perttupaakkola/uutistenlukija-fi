{{/* newsletter-band.html — homepage newsletter signup card below the fold. */}}
<section id="newsletter-signup" class="newsletter-signup newsletter-signup--home" aria-labelledby="newsletter-band-heading">
  <div class="newsletter-signup__inner">
    <div class="newsletter-signup__copy">
      <p class="newsletter-signup__eyebrow">Päivittäinen kooste</p>
      <h2 id="newsletter-band-heading" class="newsletter-signup__title">Tilaa päivittäinen uutiskooste sähköpostiisi</h2>
      <p class="newsletter-signup__text">Saat tärkeimmät uutiset suomeksi kerran päivässä. Hyvä tapa pysyä kartalla ilman jatkuvaa doomscrollausta.</p>
    </div>
    <form class="newsletter-signup__form"
          action="#newsletter-signup"
          method="get"
          data-location="homepage">
      <input type="hidden" name="source" value="homepage">
      <label for="newsletter-home-email" class="visually-hidden">Sähköpostiosoite</label>
      <input id="newsletter-home-email"
             type="email"
             name="email"
             placeholder="sinun@email.fi"
             required
             autocomplete="email"
             class="newsletter-signup__input">
      <button type="submit" class="newsletter-signup__button">Tilaa ilmaiseksi</button>
    </form>
    <p class="newsletter-signup__note">Tulossa pian. Ei roskapostia. <a href="/tietosuojaseloste/">Tietosuoja</a>.</p>
  </div>
</section>
