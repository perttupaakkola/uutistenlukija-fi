{{- $page := . -}}
{{- $sourceName := $page.Params.source_name | default "" -}}
{{- $sourceUrl := $page.Params.source_url | default "" -}}
{{- if and $sourceName $sourceUrl }}
<div class="source-attribution" role="note" aria-label="Artikkelin lähde">
  <span class="source-attribution__label">Pohjautuu lähteeseen</span>
  <a class="source-attribution__link" href="{{ $sourceUrl }}" target="_blank" rel="noopener noreferrer">{{ $sourceName }}</a>
</div>
{{- end }}
