{{- $url   := .Permalink | absURL -}}
{{- $title := .Title | urlquery -}}
<div class="social-share" aria-label="Jaa artikkeli">
  <span class="social-share__label">Jaa:</span>

  {{/* Facebook */}}
  <a class="social-share__btn social-share__btn--facebook"
     href="https://www.facebook.com/sharer/sharer.php?u={{ $url }}"
     target="_blank" rel="noopener noreferrer"
     aria-label="Jaa Facebookissa" title="Jaa Facebookissa">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
    </svg>
  </a>

  {{/* X / Twitter */}}
  <a class="social-share__btn social-share__btn--x"
     href="https://twitter.com/intent/tweet?url={{ $url }}&text={{ $title }}"
     target="_blank" rel="noopener noreferrer"
     aria-label="Jaa X:ssä (Twitter)" title="Jaa X:ssä">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
  </a>

  {{/* LinkedIn */}}
  <a class="social-share__btn social-share__btn--linkedin"
     href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url }}"
     target="_blank" rel="noopener noreferrer"
     aria-label="Jaa LinkedInissä" title="Jaa LinkedInissä">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
      <rect x="2" y="9" width="4" height="12"/>
      <circle cx="4" cy="4" r="2"/>
    </svg>
  </a>

  {{/* WhatsApp */}}
  <a class="social-share__btn social-share__btn--whatsapp"
     href="https://wa.me/?text={{ $title }}%20{{ $url }}"
     target="_blank" rel="noopener noreferrer"
     aria-label="Jaa WhatsAppissa" title="Jaa WhatsAppissa">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
      <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.85L.057 23.286a.75.75 0 0 0 .921.921l5.44-1.475A11.934 11.934 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.73 9.73 0 0 1-4.953-1.352l-.355-.211-3.677.997.974-3.564-.23-.368A9.718 9.718 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/>
    </svg>
  </a>

  {{/* Copy link */}}
  <button class="social-share__btn social-share__btn--copy"
          data-url="{{ $url }}"
          aria-label="Kopioi linkki" title="Kopioi linkki">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
  </button>
</div>

<script>
(function(){
  document.querySelectorAll('.social-share__btn--copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var url = btn.getAttribute('data-url');
      if(navigator.clipboard){
        navigator.clipboard.writeText(url).then(function(){
          btn.classList.add('social-share__btn--copied');
          setTimeout(function(){ btn.classList.remove('social-share__btn--copied'); }, 2000);
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        btn.classList.add('social-share__btn--copied');
        setTimeout(function(){ btn.classList.remove('social-share__btn--copied'); }, 2000);
      }
    });
  });
})();
</script>
