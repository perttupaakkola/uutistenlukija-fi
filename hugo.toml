title = 'Uutistenlukija'
theme = 'uutistenlukija'
defaultContentLanguage = 'fi'
enableRobotsTXT = true
[pagination]
  pagerSize = 20

[params]
  description = "Tekoälyn kuratoima uutiskooste suomeksi"
  author = "Uutistenlukija"
  dateFormat = "2.1.2006"

[taxonomies]
