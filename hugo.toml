baseURL = 'https://uutistenlukija.fi/'
locale = 'fi'
title = 'Uutistenlukija'
theme = 'uutistenlukija'
defaultContentLanguage = 'fi'
enableRobotsTXT = true
disableHugoGeneratorInject = true
[pagination]
  pagerSize = 30
  disableAliases = true

[params]
  description = "Kotimaan ja maailman uutiset — talous, teknologia, urheilu, kulttuuri ja tiede."
  shortTitle = "Uutistenlukija"
  author = "Uutistenlukija"
  dateFormat = "2.1.2006"
  ga4_id = "G-35XERS8V6J"
  cf_beacon_token = ""   # set to Cloudflare Web Analytics token to activate
  twitter_site = "@uutistenlukija"
  ads_enabled = false
  adsense_id = ""
  ads_consent_revision = 2
  ads_activation_revision = 3

  [params.publisher]
    name = "Uutistenlukija"
    url = "https://uutistenlukija.fi"
    logo = "images/publisher-logo.png"
    logoWidth = 400
    logoHeight = 60
    foundingDate = "2024"
    sameAs = [
      "https://x.com/uutistenlukija"
    ]

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changeFreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputFormats]
  [outputFormats.NewsSitemap]
    baseName = "news-sitemap"
    mediaType = "application/xml"
    isPlainText = true
    notAlternative = true

  [outputFormats.llmstxt]
    baseName = "llms"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "NewsSitemap", "Sitemap", "llmstxt"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[related]
  threshold = 80
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "tags"

[menu]
  [[menu.main]]
    name = "Kotimaa"
    url = "/categories/kotimaa/"
    weight = 1
  [[menu.main]]
    name = "Ulkomaat"
    url = "/categories/ulkomaat/"
    weight = 2
  [[menu.main]]
    name = "Talous"
    url = "/kategoriat/talous/"
    weight = 3
  [[menu.main]]
    name = "Teknologia"
    url = "/categories/teknologia/"
    weight = 4
  [[menu.main]]
    name = "Urheilu"
    url = "/categories/urheilu/"
    weight = 5
  [[menu.main]]
    name = "Kulttuuri"
    url = "/categories/kulttuuri/"
    weight = 6
  [[menu.main]]
    name = "Tiede"
    url = "/categories/tiede/"
    weight = 7
  [[menu.main]]
    name = "Oppaat"
    url = "/oppaat/"
    weight = 8
