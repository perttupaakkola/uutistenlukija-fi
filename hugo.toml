baseURL = 'https://uutistenlukija.fi/'
locale = 'fi'
title = 'Uutistenlukija – Päivän uutiset suomeksi'
theme = 'uutistenlukija'
defaultContentLanguage = 'fi'
enableRobotsTXT = true
disableHugoGeneratorInject = true
[pagination]
  pagerSize = 20

[params]
  description = "Päivän tärkeimmät uutiset suomeksi — kotimaa, ulkomaat, talous, teknologia, urheilu, kulttuuri ja tiede."
  shortTitle = "Uutistenlukija"
  author = "Uutistenlukija"
  dateFormat = "2.1.2006"
  ga4_id = "G-35XERS8V6J"
  cf_beacon_token = ""   # set to Cloudflare Web Analytics token to activate
  twitter_site = "@uutistenlukija"
  ads_enabled = false
  adsense_id = ""

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changeFreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputFormats]
  [outputFormats.NewsSitemap]
    baseName = "news-sitemap"
    mediaType = "application/xml"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "NewsSitemap", "Sitemap"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[related]
  threshold = 80
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "tags"

[menu]
  [[menu.main]]
    name = "Päivän kooste"
    url = "/paivan-kooste/"
    weight = -1
  [[menu.main]]
    name = "Kotimaa"
    url = "/categories/kotimaa/"
    weight = 1
  [[menu.main]]
    name = "Ulkomaat"
    url = "/categories/ulkomaat/"
    weight = 2
  [[menu.main]]
    name = "Talous"
    url = "/categories/talous/"
    weight = 3
  [[menu.main]]
    name = "Teknologia"
    url = "/categories/teknologia/"
    weight = 4
  [[menu.main]]
    name = "Urheilu"
    url = "/categories/urheilu/"
    weight = 5
  [[menu.main]]
    name = "Kulttuuri"
    url = "/categories/kulttuuri/"
    weight = 6
  [[menu.main]]
    name = "Tiede"
    url = "/categories/tiede/"
    weight = 7
  [[menu.main]]
    name = "Toimitus"
    url = "/toimitus/"
    weight = 8
  [[menu.main]]
    name = "Haku"
    url = "/haku/"
    weight = 9
