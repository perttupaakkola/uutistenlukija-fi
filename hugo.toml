baseURL = 'https://uutistenlukija.fi/'
languageCode = 'fi'
title = 'Uutistenlukija'
theme = 'uutistenlukija'
defaultContentLanguage = 'fi'
enableRobotsTXT = true
disableHugoGeneratorInject = true

[pagination]
  pagerSize = 20

[params]
  description = "Päivän tärkeimmät uutiset suomeksi — kotimaa, ulkomaat, talous, teknologia, urheilu, kulttuuri ja tiede."
  author = "Uutistenlukija"
  dateFormat = "2.1.2006"
  ga4_id = "G-967GVZH75X"
  twitter_site = "@uutistenlukija"

[taxonomies]
  category = "categories"

[sitemap]
  changeFreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats]
  [outputFormats.JSON]
    name = "JSON"
    baseName = "index"
    mediaType = "application/json"
    isPlainText = true
    notAlternative = true
  
  [outputFormats.NewsSitemap]
    baseName = "news-sitemap"
    mediaType = "application/xml"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "NewsSitemap"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[menu]
  [[menu.main]]
    name = "Päivän kooste"
    url = "/paivan-kooste/"
    weight = -1
  [[menu.main]]
    name = "Kotimaa"
    url = "/categories/kotimaa/"
    weight = 1
  [[menu.main]]
    name = "Ulkomaat"
    url = "/categories/ulkomaat/"
    weight = 2
  [[menu.main]]
    name = "Talous"
    url = "/categories/talous/"
    weight = 3
  [[menu.main]]
    name = "Teknologia"
    url = "/categories/teknologia/"
    weight = 4
  [[menu.main]]
    name = "Urheilu"
    url = "/categories/urheilu/"
    weight = 5
  [[menu.main]]
    name = "Kulttuuri"
    url = "/categories/kulttuuri/"
    weight = 6
  [[menu.main]]
    name = "Tiede"
    url = "/categories/tiede/"
    weight = 7
  [[menu.main]]
    name = "Toimitus"
    url = "/toimitus/"
    weight = 8
  [[menu.main]]
    name = "Haku"
