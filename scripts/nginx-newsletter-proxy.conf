# Add to your uutistenlukija.fi nginx server block
# Proxies /api/ to the newsletter FastAPI service on port 8765

location /api/ {
    proxy_pass         http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;

    # Limit to POST on /api/subscribe only
    location /api/subscribe {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8765/subscribe;
    }

    # Public count endpoint
    location /api/subscribe/count {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765/subscribe/count;
    }
}
