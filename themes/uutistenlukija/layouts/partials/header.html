<header class="site-header">
  <div class="header-banner"></div>
  <div class="container" style="position:relative;">
    <div class="site-logo">
      <a href="/"><img src="/images/logo.png" alt="Uutistenlukija" class="logo-img"></a>
    </div>
    <p class="site-date">{{ now | time.Format "Monday 2. January 2006" }}</p>
    <nav class="main-nav">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="Vaihda teema" style="position:absolute;top:1.5rem;right:1.5rem;background:none;border:1px solid var(--border);border-radius:4px;padding:0.3rem 0.6rem;cursor:pointer;font-size:1rem;color:var(--text);">
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-label">Tumma</span>
    </button>
  </div>
</header>
