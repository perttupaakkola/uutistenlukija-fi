{{ define "main" }}
<div class="category-header">
  <h1>{{ .Title }}</h1>
</div>
<div class="articles-grid">
  {{ range .Pages.ByDate.Reverse }}
  <article class="article-card">
    {{ with .Params.categories }}
    {{ $cat := index . 0 }}<span class="category-pill" data-cat="{{ $cat | lower }}">{{ $cat }}</span>
    {{ end }}
    <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
    <p class="excerpt">{{ .Summary | truncate 200 }}</p>
    <div class="meta">
      {{ .Date | time.Format "2.1.2006" }}
      {{ with .Params.author }} · <span class="author-inline">{{ . }}</span>{{ end }}
    </div>
  </article>
  {{ end }}
</div>
{{ end }}
