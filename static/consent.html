<dialog id="consent-dialog" aria-labelledby="consent-title" aria-describedby="consent-description" tabindex="-1">
<div class="consent-dialog__inner">
<h2 id="consent-title">Autatko meitä tekemään parempia uutisia?</h2>
<p id="consent-description" class="consent-dialog__copy">Uutistenlukija on pieni, mainokseton uutispalvelu. Analytiikka kertoo meille, mitkä jutut ja oppaat ovat hyödyllisiä, jotta voimme tehdä niitä lisää.</p>
<p class="consent-dialog__note">Ei mainoksia, ei tietojen myyntiä. Voit muuttaa valintaa milloin tahansa.</p>
<div class="consent-dialog__actions">
<button id="consent-accept" type="button">Hyväksy</button>
<button id="consent-reject" type="button">Ei kiitos</button>
</div>

</div>
</dialog>
