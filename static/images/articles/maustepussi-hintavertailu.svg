<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Maustepussien hinta- ja sisältövertailu</title>
  <desc id="desc">Kuvituskuva kahdesta maustepussista, suurennuslasista ja tuoteselosteesta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7c2d12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="170" fill="#fff" opacity="0.22"/>
  <circle cx="150" cy="560" r="220" fill="#7c2d12" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="245" y="125" width="265" height="400" rx="28" fill="url(#packet)"/>
    <path d="M245 185h265v88H245z" fill="#dc2626"/>
    <text x="378" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#fff">ISO PUSSI</text>
    <text x="378" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#7c2d12">2,99€</text>
    <text x="378" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">suola • sokeri</text>
    <rect x="292" y="430" width="172" height="44" rx="22" fill="#f59e0b"/>
    <text x="378" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#111827">KATSO SISÄLTÖ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="145" width="225" height="350" rx="26" fill="#fffbeb"/>
    <path d="M690 200h225v72H690z" fill="#16a34a"/>
    <text x="803" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">MAUSTE</text>
    <text x="803" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#14532d">1,49€</text>
    <text x="803" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">tuoteseloste</text>
  </g>

  <g transform="translate(548 308) rotate(-12)">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#111827" stroke-width="20" opacity="0.88"/>
    <line x1="68" y1="68" x2="175" y2="175" stroke="#111827" stroke-width="24" stroke-linecap="round" opacity="0.88"/>
    <circle cx="0" cy="0" r="70" fill="#fff" opacity="0.18"/>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#431407">Halpa hinta ei kerro koko sisältöä</text>
</svg>
