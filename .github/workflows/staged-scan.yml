name: Staged scan

# Actions-side scanner (owner directive, Perttu, 2026-07-23).
# Replaces only the quiesced VPS `staged_publish.py scan` cron. The Monica
# worker remains on the VPS and stays paused until a separate deliberate
# restoration decision.
#
# Scheduled runs are inert until `pipeline/actions-scan.enabled` exists.
# Authenticated manual dispatch from exact main is the preferred one-shot
# canary path. The exact staged_scan_recovery repository dispatch provides a
# credential-neutral recovery path from default main. If dispatch permission
# is unavailable, operators may add the marker for one scheduled canary and
# remove it after completion, before the next boundary. The marker otherwise
# remains reserved for final cutover.

on:
  schedule:
    # Scanner -> retained VPS worker -> publisher spacing:
    # 01 -> 03 -> 13; 16 -> 23 -> 28; 31 -> 33 -> 43; 46 -> 53 -> 58.
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types:
      - staged_scan_recovery

permissions:
  contents: write

concurrency:
  group: staged-scan
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  STAGED_SCAN_EVENT_ACTION: ${{ github.event.action || '' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate automated runs on cutover marker
        id: gate
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Staged scan manual canary must run from refs/heads/main; got ${GITHUB_REF:-<unset>}."
                exit 1
              fi
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "mode=canary" >> "$GITHUB_OUTPUT"
              ;;
            repository_dispatch)
              if [ "${STAGED_SCAN_EVENT_ACTION:-}" != "staged_scan_recovery" ]; then
                echo "::error::Unsupported staged scan repository_dispatch type: ${STAGED_SCAN_EVENT_ACTION:-<unset>}"
                exit 1
              fi
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Staged scan recovery canary must run from refs/heads/main; got ${GITHUB_REF:-<unset>}."
                exit 1
              fi
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "mode=canary" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              if [ -f pipeline/actions-scan.enabled ]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                echo "mode=cutover" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "mode=disabled" >> "$GITHUB_OUTPUT"
                echo "Cutover marker pipeline/actions-scan.enabled not present; skipping scheduled run."
              fi
              ;;
            *)
              echo "::error::Unsupported staged scan event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

      - name: Declare RSS-only restoration mode
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "Firehose is quarantined pending provider-side credential rotation; scanning RSS/public research sources only."
          printf '%s\n' 'source_mode=rss-only' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git identity
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898062+github-actions[bot]@users.noreply.github.com"

      - name: Capture staged queue before scan
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          queue_root = Path("pipeline/queues/staged")
          files = {
              path.relative_to(queue_root).as_posix(): hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
              for path in sorted(queue_root.rglob("*"))
              if path.is_file()
          }
          snapshot = {
              "ready_count": sum(
                  path.startswith("ready/") and path.endswith(".json")
                  for path in files
              ),
              "files": files,
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "staged-scan-before.json"
          target.write_text(json.dumps(snapshot, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(snapshot, sort_keys=True))
          PY

      - name: Scan one staged packet
        if: steps.gate.outputs.enabled == 'true'
        run: |
          timeout --signal=TERM --kill-after=15s 240s python3 pipeline/staged_publish.py scan --max-packets 1 --max-research-candidates 8 --dedup-window 48 --max-ready-backlog 150 --max-ready-age-hours 24

      - name: Verify queue delta and push
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          queue_root = Path("pipeline/queues/staged")
          before = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "staged-scan-before.json").read_text(
                  encoding="utf-8"
              )
          )
          before_files = before["files"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_action = os.environ.get("STAGED_SCAN_EVENT_ACTION", "")
          supervised_canary = event_name == "workflow_dispatch" or (
              event_name == "repository_dispatch"
              and event_action == "staged_scan_recovery"
          )
          after_paths = {
              path.relative_to(queue_root).as_posix(): path
              for path in sorted(queue_root.rglob("*"))
              if path.is_file()
          }
          after_files = {
              relative: hashlib.sha256(path.read_bytes()).hexdigest()
              for relative, path in after_paths.items()
          }
          added_paths = sorted(set(after_files) - set(before_files))
          removed_paths = sorted(set(before_files) - set(after_files))
          modified_paths = sorted(
              path
              for path in set(before_files) & set(after_files)
              if before_files[path] != after_files[path]
          )
          ready_added_paths = [
              path
              for path in added_paths
              if Path(path).parent == Path("ready") and Path(path).suffix == ".json"
          ]
          other_added_paths = [
              path for path in added_paths if path not in ready_added_paths
          ]

          if len(ready_added_paths) > 1:
              raise SystemExit(
                  f"scan added {len(ready_added_paths)} ready packets; "
                  "max-packets contract is 1"
              )
          if supervised_canary:
              if (
                  len(ready_added_paths) != 1
                  or other_added_paths
                  or removed_paths
                  or modified_paths
              ):
                  raise SystemExit(
                      "supervised canary expected exactly one new ready packet "
                      "and no other staged queue changes; "
                      f"ready_added_paths={ready_added_paths} "
                      f"other_added_paths={other_added_paths} "
                      f"removed_paths={removed_paths} "
                      f"modified_paths={modified_paths}"
                  )
          elif event_name == "schedule":
              removed_ready_paths = [
                  path
                  for path in removed_paths
                  if Path(path).parent == Path("ready")
                  and Path(path).suffix == ".json"
              ]
              failed_added_paths = [
                  path
                  for path in other_added_paths
                  if Path(path).parent == Path("failed")
                  and Path(path).suffix == ".json"
              ]
              unexpected_removed_paths = [
                  path for path in removed_paths if path not in removed_ready_paths
              ]
              unexpected_added_paths = [
                  path for path in other_added_paths if path not in failed_added_paths
              ]
              unmatched_failed_paths = set(failed_added_paths)
              unmatched_removed_paths = []
              for removed_path in removed_ready_paths:
                  removed = Path(removed_path)
                  matches = sorted(
                      path
                      for path in unmatched_failed_paths
                      if Path(path).name == removed.name
                      or Path(path).stem.startswith(f"{removed.stem}_")
                  )
                  if matches:
                      unmatched_failed_paths.remove(matches[0])
                  else:
                      unmatched_removed_paths.append(removed_path)
              if (
                  unexpected_removed_paths
                  or unexpected_added_paths
                  or unmatched_removed_paths
                  or unmatched_failed_paths
                  or modified_paths
              ):
                  raise SystemExit(
                      "scheduled scan contained queue changes outside bounded "
                      "ready-to-failed expiry moves; "
                      f"unexpected_added_paths={unexpected_added_paths} "
                      f"unexpected_removed_paths={unexpected_removed_paths} "
                      f"unmatched_removed_paths={unmatched_removed_paths} "
                      f"unmatched_failed_paths={sorted(unmatched_failed_paths)} "
                      f"modified_paths={modified_paths}"
                  )
          else:
              raise SystemExit(
                  f"unsupported staged scan event: {event_name}/{event_action}"
              )

          added = []
          for relative in ready_added_paths:
              path = after_paths[relative]
              name = path.name
              data = json.loads(path.read_text(encoding="utf-8"))
              packet = data.get("packet") or {}
              required_strings = ("packet_id", "headline_seed", "link", "source_text")
              missing = [key for key in required_strings if not str(packet.get(key) or "").strip()]
              if data.get("schema") != "uutistenlukija.staged_packet.v1":
                  raise SystemExit(f"{name}: invalid staged packet schema")
              if packet.get("packet_id") != path.stem:
                  raise SystemExit(f"{name}: packet_id does not match filename")
              if missing:
                  raise SystemExit(f"{name}: missing packet fields {','.join(missing)}")
              if packet.get("selected_source_provenance_error"):
                  raise SystemExit(f"{name}: selected source provenance is invalid")
              if packet.get("source_selection_outcome") != "usable_source_packet":
                  raise SystemExit(f"{name}: source selection is not usable")
              added.append(
                  {
                      "file": name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "packet_id": packet["packet_id"],
                      "category": packet.get("category") or packet.get("category_hint"),
                      "source_words": len(packet["source_text"].split()),
                      "source_blocks": len(packet.get("clean_source_blocks") or []),
                  }
              )

          summary = {
              "event_name": event_name,
              "event_action": event_action,
              "pre_count": before["ready_count"],
              "post_count": sum(
                  path.startswith("ready/") and path.endswith(".json")
                  for path in after_files
              ),
              "added": added,
              "added_paths": added_paths,
              "removed_paths": removed_paths,
              "modified_paths": modified_paths,
              "other_added_paths": other_added_paths,
              "removed_ready_files": [
                  Path(path).name
                  for path in removed_paths
                  if Path(path).parent == Path("ready")
              ],
          }
          manifest = Path(os.environ["RUNNER_TEMP"]) / "staged-scan-manifest.json"
          manifest.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("## Staged scan queue delta\n\n```json\n")
              output.write(json.dumps(summary, indent=2))
              output.write("\n```\n")
          PY

          git add -- pipeline/queues/staged
          staged_paths="$(git diff --cached --name-only)"
          if [ -z "$staged_paths" ]; then
            echo "No deterministic staged queue changes to commit."
            exit 0
          fi
          if printf '%s\n' "$staged_paths" | grep -Ev '^pipeline/queues/staged/' >/dev/null; then
            echo "::error::Refusing to commit a path outside pipeline/queues/staged/."
            exit 1
          fi
          git diff --cached --check
          git commit -m "auto: stage one scanner packet"
          git pull --rebase origin main
          git push origin HEAD:main
