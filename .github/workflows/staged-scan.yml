name: Staged scan

# Actions-side scanner (owner directive, Perttu, 2026-07-23).
# Replaces only the quiesced VPS `staged_publish.py scan` cron. The Monica
# worker remains on the VPS and stays paused until a separate deliberate
# restoration decision.
#
# Scheduled runs are inert until `pipeline/actions-scan.enabled` exists.
# Manual dispatch bypasses the marker solely for the bounded max-1 canary.

on:
  schedule:
    # Scanner -> retained VPS worker -> publisher spacing:
    # 01 -> 03 -> 13; 16 -> 23 -> 28; 31 -> 33 -> 43; 46 -> 53 -> 58.
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: staged-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate scheduled runs on cutover marker
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ ! -f pipeline/actions-scan.enabled ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cutover marker pipeline/actions-scan.enabled not present; skipping scheduled run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require supplementary research-source credential
        if: steps.gate.outputs.enabled == 'true'
        env:
          FIREHOSE_TOKEN: ${{ secrets.FIREHOSE_TOKEN }}
        run: |
          if [ -z "$FIREHOSE_TOKEN" ]; then
            echo "::error::Required GitHub Secret FIREHOSE_TOKEN is not configured."
            exit 1
          fi

      - name: Configure git identity
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898062+github-actions[bot]@users.noreply.github.com"

      - name: Capture ready queue before scan
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          ready = Path("pipeline/queues/staged/ready")
          files = sorted(path.name for path in ready.glob("*.json"))
          snapshot = {"count": len(files), "files": files}
          target = Path(os.environ["RUNNER_TEMP"]) / "staged-scan-before.json"
          target.write_text(json.dumps(snapshot, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(snapshot, sort_keys=True))
          PY

      - name: Scan one staged packet
        if: steps.gate.outputs.enabled == 'true'
        env:
          FIREHOSE_TOKEN: ${{ secrets.FIREHOSE_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=15s 240s python3 pipeline/staged_publish.py scan --max-packets 1 --max-research-candidates 8 --dedup-window 48 --max-ready-backlog 150 --max-ready-age-hours 24

      - name: Verify queue delta and push
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          ready = Path("pipeline/queues/staged/ready")
          before = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "staged-scan-before.json").read_text(
                  encoding="utf-8"
              )
          )
          before_files = set(before["files"])
          after_paths = {path.name: path for path in ready.glob("*.json")}
          added_names = sorted(set(after_paths) - before_files)
          removed_names = sorted(before_files - set(after_paths))

          if len(added_names) > 1:
              raise SystemExit(
                  f"scan added {len(added_names)} ready packets; max-packets contract is 1"
              )
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and len(added_names) != 1:
              raise SystemExit(
                  "manual canary expected exactly one new ready packet; "
                  f"observed {len(added_names)}"
              )

          added = []
          for name in added_names:
              path = after_paths[name]
              data = json.loads(path.read_text(encoding="utf-8"))
              packet = data.get("packet") or {}
              required_strings = ("packet_id", "headline_seed", "link", "source_text")
              missing = [key for key in required_strings if not str(packet.get(key) or "").strip()]
              if data.get("schema") != "uutistenlukija.staged_packet.v1":
                  raise SystemExit(f"{name}: invalid staged packet schema")
              if packet.get("packet_id") != path.stem:
                  raise SystemExit(f"{name}: packet_id does not match filename")
              if missing:
                  raise SystemExit(f"{name}: missing packet fields {','.join(missing)}")
              if packet.get("selected_source_provenance_error"):
                  raise SystemExit(f"{name}: selected source provenance is invalid")
              if packet.get("source_selection_outcome") != "usable_source_packet":
                  raise SystemExit(f"{name}: source selection is not usable")
              added.append(
                  {
                      "file": name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "packet_id": packet["packet_id"],
                      "category": packet.get("category") or packet.get("category_hint"),
                      "source_words": len(packet["source_text"].split()),
                      "source_blocks": len(packet.get("clean_source_blocks") or []),
                  }
              )

          summary = {
              "pre_count": before["count"],
              "post_count": len(after_paths),
              "added": added,
              "removed_ready_files": removed_names,
          }
          manifest = Path(os.environ["RUNNER_TEMP"]) / "staged-scan-manifest.json"
          manifest.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("## Staged scan queue delta\n\n```json\n")
              output.write(json.dumps(summary, indent=2))
              output.write("\n```\n")
          PY

          git add -- pipeline/queues/staged
          staged_paths="$(git diff --cached --name-only)"
          if [ -z "$staged_paths" ]; then
            echo "No deterministic staged queue changes to commit."
            exit 0
          fi
          if printf '%s\n' "$staged_paths" | grep -Ev '^pipeline/queues/staged/' >/dev/null; then
            echo "::error::Refusing to commit a path outside pipeline/queues/staged/."
            exit 1
          fi
          git diff --cached --check
          git commit -m "auto: stage one scanner packet"
          git pull --rebase origin main
          git push origin HEAD:main
