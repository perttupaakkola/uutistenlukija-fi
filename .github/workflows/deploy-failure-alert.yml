name: Immediate deploy failure alert

on:
  workflow_run:
    workflows:
      - Deploy to Cloudflare Pages
      - Staged publish
      - Daily kooste
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord immediately
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || '' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_PIPELINE_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_PIPELINE_WEBHOOK is missing, skipping alert")
              raise SystemExit(0)

          repo = os.environ["REPO"]
          run_id = os.environ["RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]

          api_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          req = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "uutistenlukija-deploy-alert",
              },
          )

          failed_job = None
          failed_step = None
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  jobs_payload = json.load(resp)
              for job in jobs_payload.get("jobs", []):
                  if job.get("conclusion") != "failure":
                      continue
                  failed_job = job.get("name")
                  for step in job.get("steps") or []:
                      if step.get("conclusion") == "failure":
                          failed_step = step.get("name")
                          break
                  break
          except Exception as exc:
              failed_job = failed_job or f"job lookup failed: {exc}"

          commit_message = (os.environ.get("COMMIT_MESSAGE") or "").splitlines()[0].strip().replace("`", "'")
          if len(commit_message) > 120:
              commit_message = commit_message[:117] + "..."

          step_line = (failed_step or failed_job or "unknown").replace("`", "'")
          content = (
              "<@483747784395063309> <@1482068741822087279> 🚨 **GitHub deploy failed immediately after push**\n"
              f"workflow: `{os.environ['WORKFLOW_NAME']}`\n"
              f"branch: `{os.environ['BRANCH']}`\n"
              f"failed step: `{step_line}`\n"
              f"actor: `{os.environ['ACTOR']}`\n"
              f"sha: `{os.environ['SHA'][:8]}`\n"
              f"run: {os.environ['RUN_URL']}\n"
              + (f"commit: `{commit_message}`\n" if commit_message else "")
              + "Fix it from the run link now."
          )

          payload = {
              "content": content,
              "allowed_mentions": {"parse": ["users"]},
          }

          webhook_req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(webhook_req, timeout=20) as resp:
              print(f"Discord alert sent, status={resp.status}")
          PY
