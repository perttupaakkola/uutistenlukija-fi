name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "pipeline/actions-publish.enabled"
      - "pipeline/actions-scan.enabled"
      - "pipeline/queues/staged/**"
      - "pipeline/firehose.py"
      - "pipeline/test_firehose.py"
      - "pipeline/AGENTS.md"
      - "scripts/test_actions_pipeline_workflows.py"
      - ".github/AGENTS.md"
      - ".github/workflows/staged-publish.yml"
      - ".github/workflows/staged-scan.yml"
      - ".github/workflows/daily-kooste.yml"
      - ".github/workflows/deploy-failure-alert.yml"
      - "docs/actions-pipeline-migration.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Admit current-main deploy event
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME:-}" in
            push|workflow_dispatch) ;;
            *)
              echo "::error title=Deploy admission failed::Unsupported deploy event ${GITHUB_EVENT_NAME:-<unset>}"
              exit 1
              ;;
          esac
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error title=Deploy admission failed::Deployment must run from refs/heads/main; got ${GITHUB_REF:-<unset>}"
            exit 1
          fi
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_HEAD" != "${GITHUB_SHA:-}" ]; then
            echo "::error title=Deploy admission failed::Checkout does not match GITHUB_SHA; checkout=$CHECKOUT_HEAD event_sha=${GITHUB_SHA:-<unset>}"
            exit 1
          fi

      - name: Setup Hugo
        run: |
          HUGO_VERSION="0.147.0"
          HUGO_DEB="/tmp/hugo.deb"
          HUGO_SHA256="d2a308de005f87e2d5ffe76b6cab924509ccb59be542cd4ea5f9471c29176b1c"
          HUGO_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget --quiet --tries=5 --waitretry=5 --retry-connrefused "$HUGO_URL" -O "$HUGO_DEB"
          test -s "$HUGO_DEB"
          echo "${HUGO_SHA256}  ${HUGO_DEB}" | sha256sum --check --strict
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Validate Hugo templates
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: bash scripts/validate_templates.sh

      - name: Validate portal CSS contract
        run: python3 scripts/validate_portal_css_contract.py

      - name: Validate critical pipeline script permissions
        run: bash scripts/validate_critical_scripts.sh

      - name: Validate frontmatter YAML syntax
        run: python3 pipeline/validate_frontmatter.py

      - name: Generate canonical pipeline status
        run: python3 pipeline/generate_pipeline_status.py

      - name: Generate business control panel
        run: python3 scripts/business_control_panel.py --pipeline-status-file static/api/pipeline-status.json --output static/api/business-control-panel.json

      - name: Build
        run: hugo --minify --cleanDestinationDir

      - name: Validate build
        continue-on-error: true
        run: python3 pipeline/ci_validate.py --skip templates

      - name: Check Cloudflare Pages file budget
        run: python3 scripts/check_public_file_count.py --public-dir public --limit 20000 --min-headroom 1000

      - name: Validate public surface
        run: python3 scripts/validate_public_surface.py --public-dir public

      - name: Verify deployment checkout is current
        id: deploy_head
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME:-}" in
            push|workflow_dispatch) ;;
            *)
              echo "::error title=Deployment freshness check failed::Unsupported deploy event ${GITHUB_EVENT_NAME:-<unset>}"
              exit 1
              ;;
          esac
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          REMOTE_REF="refs/remotes/origin/deploy-main"
          if ! git fetch --no-tags --force origin "refs/heads/main:${REMOTE_REF}"; then
            echo "::error title=Deployment freshness check failed::Unable to fetch refs/heads/main"
            exit 1
          fi
          if ! REMOTE_MAIN="$(git rev-parse --verify --quiet "${REMOTE_REF}^{commit}")"; then
            echo "::error title=Deployment freshness check failed::Unable to resolve fetched origin/main"
            exit 1
          fi
          if [ -z "$REMOTE_MAIN" ] || [ "$(printf '%s\n' "$REMOTE_MAIN" | wc -l)" -ne 1 ]; then
            echo "::error title=Deployment freshness check failed::Fetched origin/main did not resolve to exactly one commit"
            exit 1
          fi
          if [ "$CHECKOUT_HEAD" != "$REMOTE_MAIN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error title=Stale manual deployment rejected::checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN"
              exit 1
            fi
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded deployment skipped::checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.deploy_head.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=uutistenlukija-fi --branch=main

      - name: Check internal links
        continue-on-error: true
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: |
          python3 pipeline/check_links.py --public-dir public
          if [ -f pipeline/logs/link_check.log ]; then
            echo "--- link_check.log (last 40 lines) ---"
            tail -40 pipeline/logs/link_check.log
          fi
