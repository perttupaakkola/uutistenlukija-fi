name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact fresh public bundle
        run: python3 -B cutover/check_release.py public release/release.json
      - name: Reject superseded main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      # 31 Oct 2026: one Cloudflare API blip ("Internal authentication error: internal
      # server error [code: 10500]") failed the single wrangler call, and the publisher
      # treats a failed run as final, so a reviewed article was lost. Cloudflare-side
      # errors are retried here, bounded (4 tries, 30/60/90 s apart); any other error
      # fails at once. Redeploying the same commit is idempotent.
      - name: Deploy to Cloudflare Pages (bounded retry on Cloudflare-side errors)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ops/pages_deploy.sh
      - name: Bind successful production deployment to this packet and commit
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          from news_mvp.release_contract import deployment_record
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/pages/projects/uutistenlukija-fi'

          def fetch():
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)

          # Cloudflare Pages reports the deployment before its production stage completes, so a
          # single read right after the push can see status 'idle'/'active' and fail an
          # otherwise-successful deploy. Measured 2026-09-16: the article went live and served
          # 200 while this step reported failure. Poll until the stage settles, and only then
          # decide - a genuine failure still fails, it just fails on evidence.
          deadline=time.time()+180
          d=None
          while time.time()<deadline:
              result=fetch()
              assert result['success'] is True
              d=result['result']['canonical_deployment']
              if (d.get('environment')=='production'
                      and (d.get('latest_stage') or {}).get('status') in ('success','failure')):
                  break
              time.sleep(10)
          assert d is not None, 'No canonical deployment reported'
          assert d['environment']=='production' and (d['latest_stage'] or {}).get('status')=='success', \
              'Production stage did not succeed: '+json.dumps(d.get('latest_stage'))
          assert d['deployment_trigger']['metadata']['commit_hash']==os.environ['GITHUB_SHA']
          receipt=json.loads(Path('release/release.json').read_text())
          record=deployment_record(receipt,d,os.environ['GITHUB_SHA'])
          Path('live-deployment.json').write_text(json.dumps(record,indent=2)+'\n')
          print('Verified production deployment',d['id'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-deployment
          path: live-deployment.json
          retention-days: 7
