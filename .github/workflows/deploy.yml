name: Pages cutover read-only precheck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact existing production deployment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/pages/projects/uutistenlukija-fi'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
              assert result['success'] is True
              return result['result']
          p=get(base);d=p['canonical_deployment'];live=get(base+'/deployments/'+d['id'])
          keep=lambda x:{k:x.get(k) for k in ('id','environment','created_on','url','aliases','latest_stage','deployment_trigger','is_skipped')}
          assert live['environment']=='production' and live['latest_stage']['status']=='success'
          record={'project':p['name'],'production_branch':p['production_branch'],'canonical_deployment':keep(live),'rollback_path':'/pages/projects/uutistenlukija-fi/deployments/'+live['id']+'/rollback','lookup_succeeded':True}
          open('pages-production.json','w').write(json.dumps(record,indent=2)+'\n')
          print('Verified existing production deployment',live['id'],live['url'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pages-production
          path: pages-production.json
          retention-days: 3
