name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        run: |
          HUGO_VERSION="0.147.0"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Validate Hugo templates
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: bash scripts/validate_templates.sh

      - name: Validate critical pipeline script permissions
        run: bash scripts/validate_critical_scripts.sh

      - name: Validate frontmatter YAML syntax
        run: python3 pipeline/validate_frontmatter.py

      - name: Build
        run: hugo --minify

      - name: Validate build
        continue-on-error: true
        run: python3 pipeline/ci_validate.py --skip templates

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=uutistenlukija-fi --branch=main

      - name: Check internal links
        continue-on-error: true
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: |
          python3 pipeline/check_links.py --public-dir public
          if [ -f pipeline/logs/link_check.log ]; then
            echo "--- link_check.log (last 40 lines) ---"
            tail -40 pipeline/logs/link_check.log
          fi
