name: Staged publish

# Actions-side publisher (owner directive, Perttu, 2026-07-23).
# Replaces the VPS `staged_publish.py publish` cron: publishes completed
# outbox packets, builds, deploys to Cloudflare Pages directly.
#
# IMPORTANT: pushes made with the default GITHUB_TOKEN do NOT trigger
# other workflows, so deploy.yml will not fire for our push — this
# workflow therefore builds and deploys itself (same steps as deploy.yml).
#
# Scheduled runs are gated on the marker file `pipeline/actions-publish.enabled`
# so this can be merged inert and cut over deliberately (see
# docs/actions-pipeline-migration.md). A push adding the marker runs one article
# immediately as the supervised canary; manual dispatch always runs.
# A reviewed workflow repair is the git-only max-1 retry when dispatch access is unavailable.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/actions-publish.enabled"
      - ".github/workflows/staged-publish.yml"
  schedule:
    # Keep the 15-minute cadence off common quarter-hour boundaries. GitHub
    # documents that scheduled events can be delayed or dropped under load.
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles to publish this run"
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-production
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # publisher.py defaults to the VPS-only /workspace/hugo path.
  HUGO_BIN: hugo
  # A clean GitHub runner builds the full archive more slowly than the VPS.
  # Keep the publisher's pre-commit validation bounded, but above the measured
  # 180-second Actions timeout; the workflow validates the result again.
  HUGO_BUILD_TIMEOUT_SEC: "600"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate automated runs on cutover marker
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ ! -f pipeline/actions-publish.enabled ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cutover marker pipeline/actions-publish.enabled not present; skipping automated run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Hugo
        if: steps.gate.outputs.enabled == 'true'
        run: |
          HUGO_VERSION="0.147.0"
          HUGO_DEB="/tmp/hugo.deb"
          HUGO_SHA256="d2a308de005f87e2d5ffe76b6cab924509ccb59be542cd4ea5f9471c29176b1c"
          HUGO_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget --quiet --tries=5 --waitretry=5 --retry-connrefused "$HUGO_URL" -O "$HUGO_DEB"
          test -s "$HUGO_DEB"
          echo "${HUGO_SHA256}  ${HUGO_DEB}" | sha256sum --check --strict
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install Python dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Configure git identity
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898062+github-actions[bot]@users.noreply.github.com"

      - name: Publish staged outbox packets
        if: steps.gate.outputs.enabled == 'true'
        env:
          # Image enrichment keys. Optional: without them articles fall back
          # to category images. Set via `gh secret set` per the migration doc.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '3' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            MAX_ARTICLES=1
          fi
          case "$MAX_ARTICLES" in
            1|2|3) ;;
            *)
              echo "::error title=Invalid staged publish cap::max_articles must be 1, 2, or 3"
              exit 1
              ;;
          esac
          python3 pipeline/staged_publish.py publish --max-articles "$MAX_ARTICLES" --git-push

      - name: Summarize staged queue runway
        if: steps.gate.outputs.enabled == 'true'
        run: python3 pipeline/generate_pipeline_status.py --actions-summary

      - name: Validate Hugo templates
        if: steps.gate.outputs.enabled == 'true'
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: bash scripts/validate_templates.sh

      - name: Validate portal CSS contract
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/validate_portal_css_contract.py

      - name: Validate critical pipeline script permissions
        if: steps.gate.outputs.enabled == 'true'
        run: bash scripts/validate_critical_scripts.sh

      - name: Validate frontmatter YAML syntax
        if: steps.gate.outputs.enabled == 'true'
        run: python3 pipeline/validate_frontmatter.py

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        run: hugo --minify --cleanDestinationDir

      - name: Validate build
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: python3 pipeline/ci_validate.py --skip templates

      - name: Check Cloudflare Pages file budget
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/check_public_file_count.py --public-dir public --limit 20000 --min-headroom 1000

      - name: Validate public surface
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/validate_public_surface.py --public-dir public

      - name: Verify deployment checkout is current
        id: deploy_head
        if: steps.gate.outputs.enabled == 'true'
        run: |
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$REMOTE_MAIN" ]; then
            echo "::error title=Deployment freshness check failed::Unable to resolve origin/main"
            exit 1
          fi
          if [ "$CHECKOUT_HEAD" != "$REMOTE_MAIN" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded deployment skipped::checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == 'true' && steps.deploy_head.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=uutistenlukija-fi --branch=main

      - name: Check internal links
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: |
          python3 pipeline/check_links.py --public-dir public
          if [ -f pipeline/logs/link_check.log ]; then
            echo "--- link_check.log (last 40 lines) ---"
            tail -40 pipeline/logs/link_check.log
          fi
