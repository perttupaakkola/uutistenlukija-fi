name: Staged publish

# Actions-side publisher (owner directive, Perttu, 2026-07-23).
# Replaces the VPS `staged_publish.py publish` cron: publishes completed
# outbox packets, builds, deploys to Cloudflare Pages directly.
#
# IMPORTANT: pushes made with the default GITHUB_TOKEN do NOT trigger
# other workflows, so deploy.yml will not fire for our push — this
# workflow therefore builds and deploys itself (same steps as deploy.yml).
#
# Scheduled runs are gated on the marker file `pipeline/actions-publish.enabled`
# so this can be merged inert and cut over deliberately (see
# docs/actions-pipeline-migration.md). A push adding the marker runs one article
# immediately as the supervised canary; manual dispatch always runs.
# A reviewed workflow repair is the git-only max-1 retry when dispatch access is unavailable.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/actions-publish.enabled"
      - "pipeline/queues/staged/outbox/**"
      - ".github/workflows/staged-publish.yml"
  schedule:
    # Keep the 15-minute cadence off common quarter-hour boundaries. GitHub
    # documents that scheduled events can be delayed or dropped under load.
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles to publish this run"
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-production
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # publisher.py defaults to the VPS-only /workspace/hugo path.
  HUGO_BIN: hugo
  # A clean GitHub runner builds the full archive more slowly than the VPS.
  # Keep the publisher's pre-commit validation bounded, but above the measured
  # 180-second Actions timeout; the workflow validates the result again.
  HUGO_BUILD_TIMEOUT_SEC: "600"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate automated runs and admit current main
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ ! -f pipeline/actions-publish.enabled ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cutover marker pipeline/actions-publish.enabled not present; skipping automated run."
            exit 0
          fi

          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_HEAD" != "$GITHUB_SHA" ]; then
            echo "::error title=Staged publish admission failed::Checkout does not match GITHUB_SHA"
            exit 1
          fi

          REMOTE_REF="refs/remotes/origin/staged-publish-main"
          if ! git fetch --no-tags --force origin "refs/heads/main:${REMOTE_REF}"; then
            echo "::error title=Staged publish admission failed::Unable to fetch refs/heads/main"
            exit 1
          fi
          REMOTE_MAIN="$(git rev-parse --verify --quiet "${REMOTE_REF}^{commit}")"
          if [ "$(printf '%s\n' "$REMOTE_MAIN" | wc -w)" -ne 1 ]; then
            echo "::error title=Staged publish admission failed::Fetched origin/main did not resolve to exactly one commit"
            exit 1
          fi

          if [ "$CHECKOUT_HEAD" != "$REMOTE_MAIN" ]; then
            case "$GITHUB_EVENT_NAME" in
              push)
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "::notice title=Superseded staged publish skipped::checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN"
                exit 0
                ;;
              schedule)
                stop_schedule_readmission() {
                  echo "enabled=false" >> "$GITHUB_OUTPUT"
                  echo "::notice title=Scheduled staged publish readmission stopped::$1"
                  exit 0
                }

                if ! git merge-base --is-ancestor "$CHECKOUT_HEAD" "$REMOTE_MAIN"; then
                  stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=ambiguous_ancestry"
                fi

                CURSOR="$REMOTE_MAIN"
                QUEUE_PATH_COUNT=0
                while [ "$CURSOR" != "$CHECKOUT_HEAD" ]; do
                  if ! COMMIT_LINE="$(git rev-list --parents -n 1 "$CURSOR")"; then
                    echo "::error title=Staged publish admission failed::Unable to inspect intervening commit $CURSOR"
                    exit 1
                  fi
                  read -r -a COMMIT_PARTS <<< "$COMMIT_LINE"
                  if [ "${#COMMIT_PARTS[@]}" -ne 2 ] || [ "${COMMIT_PARTS[0]}" != "$CURSOR" ]; then
                    stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=ambiguous_ancestry commit=$CURSOR"
                  fi
                  PARENT="${COMMIT_PARTS[1]}"

                  if ! CHANGED_PATHS="$(git diff-tree --no-commit-id --name-only --no-renames -r "$PARENT" "$CURSOR" --)"; then
                    echo "::error title=Staged publish admission failed::Unable to inspect intervening paths for $CURSOR"
                    exit 1
                  fi
                  if [ -z "$CHANGED_PATHS" ]; then
                    stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=empty_intervening_commit commit=$CURSOR"
                  fi

                  while IFS= read -r CHANGED_PATH; do
                    case "$CHANGED_PATH" in
                      pipeline/queues/staged/*.json) ;;
                      *)
                        stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=wider_drift path=$CHANGED_PATH"
                        ;;
                    esac

                    TREE_ENTRY_COUNT=0
                    for TREEISH in "$PARENT" "$CURSOR"; do
                      if ! TREE_ENTRY="$(git ls-tree "$TREEISH" -- "$CHANGED_PATH")"; then
                        echo "::error title=Staged publish admission failed::Unable to inspect $CHANGED_PATH at $TREEISH"
                        exit 1
                      fi
                      if [ -n "$TREE_ENTRY" ]; then
                        TREE_ENTRY_COUNT=$((TREE_ENTRY_COUNT + 1))
                        ENTRY_MODE="${TREE_ENTRY%% *}"
                        ENTRY_REST="${TREE_ENTRY#* }"
                        ENTRY_TYPE="${ENTRY_REST%% *}"
                        if [ "$ENTRY_MODE" != "100644" ] || [ "$ENTRY_TYPE" != "blob" ]; then
                          stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=non_data_queue_entry path=$CHANGED_PATH"
                        fi
                        if ! git cat-file blob "$TREEISH:$CHANGED_PATH" | python3 -m json.tool >/dev/null; then
                          stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=invalid_queue_json path=$CHANGED_PATH"
                        fi
                      fi
                    done
                    if [ "$TREE_ENTRY_COUNT" -eq 0 ]; then
                      stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=unresolved_queue_entry path=$CHANGED_PATH"
                    fi
                    QUEUE_PATH_COUNT=$((QUEUE_PATH_COUNT + 1))
                  done <<< "$CHANGED_PATHS"

                  CURSOR="$PARENT"
                done

                if [ "$QUEUE_PATH_COUNT" -eq 0 ]; then
                  stop_schedule_readmission "checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN reason=no_queue_data_motion"
                fi
                if ! CHECKOUT_STATUS="$(git status --porcelain=v1 -uall)"; then
                  echo "::error title=Staged publish admission failed::Unable to inspect checkout cleanliness"
                  exit 1
                fi
                if [ -n "$CHECKOUT_STATUS" ]; then
                  echo "::error title=Staged publish admission failed::Checkout became dirty before schedule readmission"
                  exit 1
                fi
                if ! git checkout main || ! git merge --ff-only "$REMOTE_MAIN"; then
                  echo "::error title=Staged publish admission failed::Unable to fast-forward scheduled checkout to $REMOTE_MAIN"
                  exit 1
                fi
                READMITTED_HEAD="$(git rev-parse HEAD)"
                if [ "$READMITTED_HEAD" != "$REMOTE_MAIN" ]; then
                  echo "::error title=Staged publish admission failed::Readmitted checkout identity mismatch"
                  exit 1
                fi

                if ! git fetch --no-tags --force origin "refs/heads/main:${REMOTE_REF}"; then
                  echo "::error title=Staged publish admission failed::Unable to refetch refs/heads/main after schedule readmission"
                  exit 1
                fi
                FRESH_REMOTE_MAIN="$(git rev-parse --verify --quiet "${REMOTE_REF}^{commit}")"
                if [ "$(printf '%s\n' "$FRESH_REMOTE_MAIN" | wc -w)" -ne 1 ]; then
                  echo "::error title=Staged publish admission failed::Refetched origin/main did not resolve to exactly one commit"
                  exit 1
                fi
                if [ "$FRESH_REMOTE_MAIN" != "$REMOTE_MAIN" ]; then
                  stop_schedule_readmission "checkout=$CHECKOUT_HEAD admitted_main=$REMOTE_MAIN current_main=$FRESH_REMOTE_MAIN reason=second_main_motion"
                fi
                ;;
              workflow_dispatch)
                echo "::error title=Stale manual staged publish rejected::checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN"
                exit 1
                ;;
              *)
                echo "::error title=Staged publish admission failed::Unsupported event $GITHUB_EVENT_NAME"
                exit 1
                ;;
            esac
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        if: steps.gate.outputs.enabled == 'true'
        run: |
          HUGO_VERSION="0.147.0"
          HUGO_DEB="/tmp/hugo.deb"
          HUGO_SHA256="d2a308de005f87e2d5ffe76b6cab924509ccb59be542cd4ea5f9471c29176b1c"
          HUGO_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget --quiet --tries=5 --waitretry=5 --retry-connrefused "$HUGO_URL" -O "$HUGO_DEB"
          test -s "$HUGO_DEB"
          echo "${HUGO_SHA256}  ${HUGO_DEB}" | sha256sum --check --strict
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install Python dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Configure git identity
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898062+github-actions[bot]@users.noreply.github.com"

      - name: Publish staged outbox packets
        if: steps.gate.outputs.enabled == 'true'
        env:
          # Image enrichment keys. Optional: without them articles fall back
          # to category images. Set via `gh secret set` per the migration doc.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '3' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            MAX_ARTICLES=1
          fi
          case "$MAX_ARTICLES" in
            1|2|3) ;;
            *)
              echo "::error title=Invalid staged publish cap::max_articles must be 1, 2, or 3"
              exit 1
              ;;
          esac
          python3 pipeline/staged_publish.py publish --max-articles "$MAX_ARTICLES" --git-push --outcome-json "$RUNNER_TEMP/staged-publish-cycle.json"

      - name: Summarize staged queue runway
        if: always() && steps.gate.outputs.enabled == 'true'
        run: python3 pipeline/generate_pipeline_status.py --cycle-outcome "$RUNNER_TEMP/staged-publish-cycle.json" --actions-summary

      - name: Preserve staged publish cycle telemetry
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staged-publish-cycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-publish-cycle.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate Hugo templates
        if: steps.gate.outputs.enabled == 'true'
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: bash scripts/validate_templates.sh

      - name: Validate portal CSS contract
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/validate_portal_css_contract.py

      - name: Validate critical pipeline script permissions
        if: steps.gate.outputs.enabled == 'true'
        run: bash scripts/validate_critical_scripts.sh

      - name: Validate frontmatter YAML syntax
        if: steps.gate.outputs.enabled == 'true'
        run: python3 pipeline/validate_frontmatter.py

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        run: hugo --minify --cleanDestinationDir

      - name: Validate build
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: python3 pipeline/ci_validate.py --skip templates

      - name: Check Cloudflare Pages file budget
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/check_public_file_count.py --public-dir public --limit 20000 --min-headroom 1000

      - name: Validate public surface
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/validate_public_surface.py --public-dir public

      - name: Verify deployment checkout is current
        id: deploy_head
        if: steps.gate.outputs.enabled == 'true'
        run: |
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$REMOTE_MAIN" ]; then
            echo "::error title=Deployment freshness check failed::Unable to resolve origin/main"
            exit 1
          fi
          if [ "$CHECKOUT_HEAD" != "$REMOTE_MAIN" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded deployment skipped::checkout=$CHECKOUT_HEAD current_main=$REMOTE_MAIN"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == 'true' && steps.deploy_head.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=uutistenlukija-fi --branch=main

      - name: Check internal links
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          DISCORD_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_PIPELINE_WEBHOOK }}
        run: |
          python3 pipeline/check_links.py --public-dir public
          if [ -f pipeline/logs/link_check.log ]; then
            echo "--- link_check.log (last 40 lines) ---"
            tail -40 pipeline/logs/link_check.log
          fi
