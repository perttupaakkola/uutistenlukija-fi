name: Source validation
"on":
  push:
    branches: ['hermes/news-rebuild-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COLLECTOR_TEST_SCRATCH: /tmp/uutis-collector-tests
      UL_READER_TEST_SCRATCH: /tmp/uutis-reader-tests
      UL_NAV_TEST_SCRATCH: /tmp/uutis-navigation-tests
      HUGO_BIN: hugo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true
      - name: Install test dependencies
        run: python -m pip install requests PyYAML beautifulsoup4 Pillow
      - name: Deployment freshness regressions
        run: python -m unittest scripts.test_deploy_queue_advancement scripts.test_actions_pipeline_workflows
      - name: Analytics and privacy regressions
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest scripts.test_collect_analytics scripts.test_analytics_rebuild scripts.test_analytics_freshness_evidence scripts.test_analytics_review scripts.test_analytics_projection scripts.test_business_control_panel
          node scripts/test_event_tracking_consent.js
      - name: Publishing regressions
        env:
          PYTHONPATH: pipeline
        run: python -m unittest test_rebuild_invariants test_pipeline_repair test_source_sufficiency test_story_packet test_research test_quality_gate test_monica_writer test_publish_preflight test_publisher_category test_generation_policy_order
      - name: Verify credential-loader test isolation
        run: python -B scripts/verify_env_test_isolation.py
      - name: Isolated final-article image semantics
        run: python -I -B pipeline/run_image_semantics_tests.py test_image_semantics test_image_pipeline_grounding test_audit_image_flow_independent test_generation_policy_order test_confidence_contract
      - name: Isolated category contract and staged caller
        run: python -I -B pipeline/run_category_contract_tests.py tests/fixtures/category-contract-housing.json
      - name: Reader and real navigation regressions
        run: |
          python tests/reader_rebuild/test_reader.py
          python tests/reader_rebuild/test_navigation.py
          python tests/reader_rebuild/test_category_coverage.py
          python tests/reader_rebuild/test_category_assets.py
          python tests/reader_rebuild/test_archive_honesty.py
      - name: Source validation
        run: |
          bash scripts/validate_critical_scripts.sh
          python scripts/validate_portal_css_contract.py
          python pipeline/validate_frontmatter.py
          bash scripts/validate_templates.sh --no-discord
      - name: Full production-mode build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          python scripts/analytics_projection.py --public-output static/api/analytics-freshness-status.json
          hugo --minify --destination public
      - name: Verify full-build news archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for page in ('index.html', 'page/2/index.html'):
              path = Path('public/paivan-tarkeimmat-uutiset') / page
              text = path.read_text()
              assert len(re.findall(r'<h2><a\b', text)) == 30, f'Empty or truncated archive: {path}'
          print('Real-base archive pagination: PASS')
          PY
      - name: Cloudflare file budget
        run: python scripts/check_public_file_count.py --public-dir public --limit 20000 --min-headroom 1000
