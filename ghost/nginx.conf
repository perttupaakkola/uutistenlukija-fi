# NGINX reverse proxy for Ghost CMS
# SSL termination via Let's Encrypt certbot
# Domain: cms.uutistenlukija.fi

# Rate limiting
limit_req_zone $binary_remote_addr zone=ghost_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ghost_admin:10m rate=5r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name cms.uutistenlukija.fi;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Ghost proxy
server {
    listen 443 ssl http2;
    server_name cms.uutistenlukija.fi;

    # SSL certs (certbot managed)
    ssl_certificate     /etc/letsencrypt/live/cms.uutistenlukija.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.uutistenlukija.fi/privkey.pem;

    # Modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Body size (Ghost image uploads)
    client_max_body_size 50m;

    # Ghost admin panel — stricter rate limit
    location /ghost/ {
        limit_req zone=ghost_admin burst=10 nodelay;
        proxy_pass http://ghost:2368;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Ghost Content API
    location /ghost/api/ {
        limit_req zone=ghost_api burst=20 nodelay;
        proxy_pass http://ghost:2368;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — long cache
    location /assets/ {
        proxy_pass http://ghost:2368;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /content/images/ {
        proxy_pass http://ghost:2368;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → Ghost
    location / {
        limit_req zone=ghost_api burst=20 nodelay;
        proxy_pass http://ghost:2368;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
